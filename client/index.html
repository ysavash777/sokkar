<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sokkaio — Fútbol 4v4 online</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Pantalla de entrada -->
  <div id="join-screen">
    <div class="join-card">
      <h1>SOKKAIO</h1>
      <p class="subtitle">Fútbol 4v4 online</p>
      <form id="join-form">
        <input id="nickname" type="text" maxlength="16" placeholder="Tu nickname" autocomplete="off" required />
        <select id="skin-select" title="Skin"></select>
        <select id="position-select" title="Posición">
          <option value="FIELD">Jugador de campo</option>
          <option value="GK">Arquero</option>
        </select>
        <button type="submit">Jugar</button>
      </form>
      <p id="join-error" class="error"></p>
      <div class="controls-help">
        <span><b>WASD</b> mover</span>
        <span><b>Shift</b> sprint</span>
        <span><b>Espacio</b> salto</span>
        <span><b>Clic izq</b> patear</span>
        <span><b>Clic rueda</b> cruzar pie</span>
        <span><b>Clic der</b> barrida</span>
        <span><b>Mouse</b> cámara 360°</span>
        <span><b>Clic rueda en el aire (arquero)</b> clavado lateral</span>
      </div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="ping">-- ms</div>
    <div id="scoreboard">
      <span class="team team-red" id="score-red">0</span>
      <span class="sep">–</span>
      <span class="team team-blue" id="score-blue">0</span>
    </div>
    <div id="stamina-wrap"><div id="stamina-bar"></div></div>
    <div id="power-wrap" class="hidden"><div id="power-bar"></div></div>
    <div id="messages"></div>
    <button id="loadout-btn" type="button" title="Personalizar / ajustes">⚙</button>
  </div>

  <!-- Panel de personalización EN PARTIDA: cambiar skin/posición y, en
       móvil, la sensibilidad de cámara — no depende de la pantalla de
       nickname. Funciona igual con clic (PC) o toque (móvil). -->
  <div id="loadout-panel" class="hidden">
    <p class="loadout-title">Ajustes</p>
    <label>Skin
      <select id="loadout-skin"></select>
    </label>
    <label>Posición
      <select id="loadout-position">
        <option value="FIELD">Jugador de campo</option>
        <option value="GK">Arquero</option>
      </select>
    </label>
    <div id="loadout-sens-section" class="hidden">
      <label>Sensibilidad libre <span id="loadout-sens-free-val"></span>
        <input type="range" id="loadout-sens-free" min="0.3" max="2.5" step="0.05" />
      </label>
      <label>Sensibilidad apuntando <span id="loadout-sens-aim-val"></span>
        <input type="range" id="loadout-sens-aim" min="0.3" max="2.5" step="0.05" />
      </label>
    </div>
    <div class="loadout-actions">
      <button type="button" id="loadout-apply-btn">Aplicar</button>
      <button type="button" id="loadout-close-btn">Cerrar</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
